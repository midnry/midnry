<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Midnry — Outpost Zero</title>
    <style>
      /* All selectors belong to this component; host-page elements are untouched. */
      midnry-fps {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 420px;
      }
      midnry-fps .mf-shell {
        position: relative;
        height: 100%;
        min-height: 420px;
        overflow: hidden;
        background: #101419;
        color: #fff4dc;
        font:
          14px system-ui,
          sans-serif;
        isolation: isolate;
      }
      midnry-fps .mf-shell * {
        box-sizing: border-box;
      }
      midnry-fps canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      midnry-fps button {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }
      midnry-fps .mf-top {
        position: absolute;
        top: 22px;
        left: 26px;
        right: 26px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        gap: 12px;
      }
      midnry-fps .mf-brand {
        font-weight: 950;
        letter-spacing: 4px;
        font-size: 20px;
      }
      midnry-fps .mf-brand small {
        display: block;
        color: #eeb74d;
        font-size: 10px;
        letter-spacing: 3px;
        margin-top: 4px;
      }
      midnry-fps .mf-topright {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      midnry-fps .mf-tag {
        border: 1px solid #ffffff55;
        padding: 7px 11px;
        font-size: 10px;
        letter-spacing: 2px;
        background: #111a;
      }
      midnry-fps .mf-pause {
        pointer-events: auto;
        border: 1px solid #ffffff55;
        background: #111a;
        width: 36px;
        height: 32px;
      }
      midnry-fps .mf-bottom {
        position: absolute;
        left: 26px;
        right: 26px;
        bottom: 25px;
        display: flex;
        justify-content: space-between;
        align-items: end;
        pointer-events: none;
      }
      midnry-fps .mf-stat {
        font-size: 11px;
        letter-spacing: 2px;
        color: #eee0c7;
      }
      midnry-fps .mf-stat strong {
        display: block;
        font-size: 36px;
        line-height: 1.15;
        letter-spacing: -1px;
        color: #fff4dc;
      }
      midnry-fps .mf-health {
        width: 140px;
        height: 5px;
        background: #402426;
        margin-top: 8px;
      }
      midnry-fps .mf-health i {
        display: block;
        height: 100%;
        width: 100%;
        background: #ffbd43;
      }
      midnry-fps .mf-ammo {
        text-align: right;
      }
      midnry-fps .mf-ammo strong span {
        font-size: 15px;
        color: #bcaf99;
        letter-spacing: 0;
      }
      midnry-fps .mf-objective {
        position: absolute;
        left: 26px;
        top: 96px;
        font-size: 10px;
        letter-spacing: 2px;
        text-shadow: 0 2px 4px #000;
        pointer-events: none;
      }
      midnry-fps .mf-objective b {
        display: block;
        font-size: 14px;
        letter-spacing: 0;
        margin-top: 6px;
        color: #ffcc58;
      }
      midnry-fps .mf-cross {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 22px;
        height: 22px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        background: linear-gradient(#fff4dc, #fff4dc) center/2px 6px no-repeat;
      }
      midnry-fps .mf-cross::before,
      midnry-fps .mf-cross::after {
        content: "";
        position: absolute;
        top: 10px;
        width: 6px;
        height: 2px;
        background: #fff4dc;
        box-shadow: 0 1px 2px #000;
      }
      midnry-fps .mf-cross::before {
        left: 0;
      }
      midnry-fps .mf-cross::after {
        right: 0;
      }
      midnry-fps .mf-toast {
        position: absolute;
        left: 50%;
        top: 62%;
        transform: translateX(-50%);
        text-align: center;
        color: #ffca49;
        font-weight: 900;
        letter-spacing: 2px;
        text-shadow: 2px 2px #000;
        pointer-events: none;
      }
      midnry-fps .mf-modal {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(90deg, #10141bd9, #10141b60);
        padding: 24px;
      }
      midnry-fps .mf-panel {
        max-height: calc(100% - 16px);
        overflow: auto;
        width: min(540px, 100%);
        padding: 34px;
        border: 2px solid #070b0e;
        background: #18212bed;
        box-shadow: 9px 9px 0 #0007;
      }
      midnry-fps .mf-eyebrow {
        color: #ffc455;
        letter-spacing: 4px;
        font-size: 11px;
        font-weight: 800;
      }
      midnry-fps h1 {
        font-size: clamp(36px, 7vw, 66px);
        line-height: 0.95;
        letter-spacing: -3px;
        text-transform: uppercase;
        margin: 18px 0;
        font-weight: 950;
      }
      midnry-fps h1 em {
        color: #ffc455;
        font-style: normal;
      }
      midnry-fps .mf-copy {
        color: #c6c8c6;
        line-height: 1.65;
        max-width: 410px;
      }
      midnry-fps .mf-start {
        margin-top: 15px;
        background: #ffc455;
        color: #141a20;
        padding: 15px 26px;
        border: 3px solid #070b0e;
        box-shadow: 4px 4px 0 #070b0e;
        font-weight: 900;
        letter-spacing: 2px;
      }
      midnry-fps .mf-modes {
        display: flex;
        gap: 8px;
        margin: 18px 0 8px;
      }
      midnry-fps .mf-mode {
        min-height: 44px;
        flex: 1;
        padding: 10px;
        border: 2px solid #070b0e;
        background: #263b44;
        font-weight: 800;
        font-size: 12px;
      }
      midnry-fps .mf-mode[aria-pressed="true"] {
        background: #ffc455;
        color: #141a20;
      }
      midnry-fps .mf-match {
        position: absolute;
        top: 141px;
        left: 26px;
        max-width: 230px;
        font-size: 11px;
        line-height: 1.9;
        font-weight: 700;
        letter-spacing: 1px;
        pointer-events: none;
        text-shadow: 1px 2px 3px #000;
      }
      midnry-fps .mf-match b {
        color: #71ebd5;
      }
      midnry-fps .mf-zone {
        color: #ffb6a7;
      }
      midnry-fps .mf-help {
        font-size: 11px;
        line-height: 1.8;
        margin-top: 24px;
        color: #9fa9b1;
      }
      midnry-fps .mf-touch {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: none;
      }
      midnry-fps .mf-stick {
        position: absolute;
        left: 24px;
        bottom: 102px;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        border: 2px solid #ffffff45;
        background: #151b2466;
        pointer-events: auto;
        touch-action: none;
      }
      midnry-fps .mf-stick i {
        position: absolute;
        left: 35px;
        top: 35px;
        width: 38px;
        height: 38px;
        border: 2px solid #fff6;
        border-radius: 50%;
        background: #ffc45580;
      }
      midnry-fps .mf-fire,
      midnry-fps .mf-reload {
        position: absolute;
        right: 25px;
        bottom: 118px;
        width: 76px;
        height: 76px;
        border: 3px solid #151b24;
        border-radius: 50%;
        background: #ffc455c9;
        color: #151b24;
        font-size: 12px;
        font-weight: 900;
        pointer-events: auto;
        touch-action: none;
      }
      midnry-fps .mf-reload {
        right: 112px;
        bottom: 115px;
        width: 48px;
        height: 48px;
        background: #e8e0ccab;
      }
      midnry-fps [hidden] {
        display: none !important;
      }
      @media (pointer: coarse) {
        midnry-fps .mf-touch {
          display: block;
        }
      }
      @media (max-width: 600px) {
        midnry-fps .mf-top {
          top: 16px;
          left: 16px;
          right: 16px;
        }
        midnry-fps .mf-bottom {
          left: 16px;
          right: 16px;
          bottom: 18px;
        }
        midnry-fps .mf-objective {
          top: 82px;
          left: 16px;
        }
        midnry-fps .mf-panel {
          max-height: calc(100% - 16px);
          overflow: auto;
          padding: 24px;
        }
        midnry-fps .mf-match {
          left: 16px;
          top: 127px;
          max-width: 210px;
          font-size: 10px;
        }
        midnry-fps .mf-tag {
          display: none;
        }
      }
      midnry-fps .mf-network {
        margin-top: 14px;
        border-top: 1px solid #fff3;
        padding-top: 12px;
        font-size: 12px;
      }
      midnry-fps .mf-network summary {
        cursor: pointer;
        min-height: 36px;
        font-weight: 800;
        color: #71ebd5;
      }
      midnry-fps .mf-netrow {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      midnry-fps .mf-netrow button,
      midnry-fps .mf-teamselect {
        min-height: 40px;
        border: 2px solid #070b0e;
        background: #263b44;
        color: #fff4dc;
        padding: 8px;
        font: inherit;
      }
      midnry-fps .mf-codeinput {
        width: 100px;
        min-height: 40px;
        border: 2px solid #070b0e;
        background: #fff4dc;
        color: #141a20;
        padding: 8px;
        text-transform: uppercase;
        font: inherit;
      }
      midnry-fps .mf-roomcode {
        font-size: 23px;
        color: #ffc455;
        letter-spacing: 4px;
      }
      midnry-fps .mf-roster {
        list-style: none;
        padding: 0;
        max-height: 130px;
        overflow: auto;
        line-height: 1.8;
      }
      midnry-fps .mf-netstatus {
        color: #ffc455;
        font-size: 11px;
        line-height: 1.5;
        min-height: 18px;
      }
      midnry-fps .mf-panel button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <!-- For inline integration copy the style, element and script. Set a height on the host. -->
  <body style="margin: 0; background: #101419">
    <midnry-fps style="height: 100dvh" aria-label="Outpost Zero first-person shooter"></midnry-fps>
    <script type="module">
      import { Arena, LEVEL, clamp } from "./outpost-sim.js";
      (() => {
        "use strict";
        // A custom element keeps state private and supports multiple independent instances.
        if (customElements.get("midnry-fps")) return;
        const TAU = Math.PI * 2;
        const angleDiff = (a) => Math.atan2(Math.sin(a), Math.cos(a));

        class MidnryFPS extends HTMLElement {
          connectedCallback() {
            if (this.engine) return;
            this.innerHTML = `<div class="mf-shell" tabindex="0">
        <canvas aria-label="Game viewport"></canvas>
        <div class="mf-top"><div class="mf-brand">MIDNRY<small>OUTPOST ZERO / FIELD OPS</small></div><div class="mf-topright"><span class="mf-tag">RAYCAST / COMIC EDITION</span><button class="mf-pause" aria-label="Pause game">II</button></div></div>
        <div class="mf-objective">TRAINING CONTRACT<b class="mf-mission">Eliminate the sentry drones</b></div>
        <div class="mf-match" hidden><b class="mf-cores">CHARGE CORES 0</b><div class="mf-teamstat"></div><div class="mf-zone"></div></div><div class="mf-cross"></div><div class="mf-toast" role="status" aria-live="polite"></div>
        <div class="mf-bottom"><div class="mf-stat">VITALS<strong class="mf-hp">100</strong><div class="mf-health"><i></i></div></div><div class="mf-stat mf-ammo">VX–7 / AUTO CARBINE<strong class="mf-rounds">24 <span>/ ∞</span></strong></div></div>
        <div class="mf-touch"><div class="mf-stick" aria-label="Movement joystick"><i></i></div><button class="mf-reload" aria-label="Reload">R</button><button class="mf-fire" aria-label="Fire weapon">FIRE</button></div>
        <div class="mf-modal"><div class="mf-panel"><div class="mf-eyebrow">MIDNRY ORIGINAL / 01</div><h1>Outpost<br><em>Zero.</em></h1><p class="mf-copy">A sun-scorched outpost. Six rogue sentries. One very loud solution. Drop into a comic-book combat sandbox.</p><div class="mf-modes" role="group" aria-label="Game mode"><button class="mf-mode" data-mode="training" aria-pressed="true">FIELD OPS</button><button class="mf-mode" data-mode="signal" aria-pressed="false">LAST SIGNAL · SOLO</button><button class="mf-mode" data-mode="duo" aria-pressed="false">PAIR OPS · DUO</button></div><details class="mf-network"><summary>PLAY ONLINE / ROOM CODE</summary><p>Invite friends. The host starts with bots filling empty seats. Online matches keep running while your menu is open.</p><div class="mf-connectrow mf-netrow"><button class="mf-create">CREATE ROOM</button><input class="mf-codeinput" maxlength="6" aria-label="Room code" placeholder="CODE"><button class="mf-join">JOIN</button></div><div class="mf-roompanel" hidden><strong class="mf-roomcode"></strong><div class="mf-netrow"><button class="mf-copyinvite">COPY INVITE</button><button class="mf-leave">LEAVE ROOM</button><label class="mf-teamlabel" hidden>Team <select class="mf-teamselect" aria-label="Choose your team"><option value="0">Pair 1</option><option value="1">Pair 2</option><option value="2">Pair 3</option><option value="3">Pair 4</option></select></label></div><ul class="mf-roster"></ul></div><div class="mf-netstatus" role="status" aria-live="polite"></div></details><button class="mf-start">DEPLOY →</button><div class="mf-help">WASD · move &nbsp; / &nbsp; Mouse · aim &nbsp; / &nbsp; Click or Space · fire<br>R · reload &nbsp; / &nbsp; Shift · sprint &nbsp; / &nbsp; Esc or P · pause<br>Touch: left stick to move, drag the right side to aim.</div></div></div>
      </div>`;
            this.engine = new Game(this);
          }
          disconnectedCallback() {
            this.engine?.destroy();
            this.engine = null;
          }
        }

        class Game {
          constructor(root) {
            this.root = root;
            this.shell = root.querySelector(".mf-shell");
            this.canvas = root.querySelector("canvas");
            this.ctx = this.canvas.getContext("2d", { alpha: false });
            this.$ = (s) => root.querySelector(s);
            this.abort = new AbortController();
            this.keys = new Set();
            this.touch = { x: 0, y: 0 };
            this.firing = false;
            this.running = false;
            this.time = 0;
            this.last = performance.now();
            this.frame = 0;
            this.viewPitch = 0;
            this.mode = "training";
            this.reset();
            this.bindInputs();
            this.bindOnline();
            this.resizeObserver = new ResizeObserver(() => this.resize());
            this.resizeObserver.observe(this.shell);
            this.resize();
            this.loop = this.loop.bind(this);
            this.frame = requestAnimationFrame(this.loop);
          }
          // Last Signal uses the same arena, with a clear center for the final zone.
          reset() {
            this.pendingShot = 0;
            this.pendingReload = false;
            this.lastNotice = 0;
            this.arena = new Arena({ mode: this.mode });
            this.selfId = "player";
            this.state = "fresh";
            this.running = false;
            this.viewPitch = 0;
            this.step = 0;
            this.keys.clear();
            this.firing = false;
            this.touch = { x: 0, y: 0 };
            this.look = null;
            this.toastUntil = 0;
            this.$(".mf-toast").textContent = "";
            this.$(".mf-start").disabled = false;
            this.$(".mf-start").textContent = "DEPLOY →";
            this.$(".mf-copy").textContent =
              this.mode === "duo"
                ? "Pair Ops: four teams of two. Your partner is marked in mint. No friendly fire. You each have two 8-second redeployments while your partner survives. Collect Charge Cores and escape Red Haze."
                : this.mode === "signal"
                  ? "Eight combatants. One survivor. Break Supply Crates for Charge Cores: +25 max health and +8 weapon damage. Red Haze closes after 12 seconds."
                  : "Six rogue sentries. Take cover, reload and secure the outpost.";
            this.updateHUD();
          }
          get player() {
            return (
              this.arena?.entities.find((e) => e.id === this.selfId) || this.arena?.entities[0]
            );
          }
          set player(value) {
            const i = this.arena.entities.findIndex((e) => e.id === this.selfId);
            this.arena.entities[i] = value;
          }
          get enemies() {
            return this.arena.entities.filter((e) => e.id !== this.selfId);
          }
          set enemies(value) {
            this.arena.entities = [this.player, ...value];
          }
          get level() {
            return this.arena.level;
          }
          get zone() {
            return this.arena.zone;
          }
          get crates() {
            return this.arena.crates;
          }
          set crates(value) {
            this.arena.crates = value;
          }
          get cores() {
            return this.arena.cores;
          }
          set cores(value) {
            this.arena.cores = value;
          }
          get time() {
            return this.arena?.time || 0;
          }
          set time(value) {
            if (this.arena) this.arena.time = value;
          }
          get ammo() {
            return this.player?.ammo || 0;
          }
          set ammo(value) {
            this.player.ammo = value;
          }
          get kills() {
            return this.player?.kills || 0;
          }
          get shotAt() {
            return this.player?.shotAt ?? -10;
          }
          get reloadUntil() {
            return this.player?.reloadUntil || 0;
          }
          get hurtAt() {
            return this.player?.hit ?? -10;
          }
          camera() {
            if (this.player.hp > 0) return this.player;
            return (
              this.enemies.find((e) => e.team === this.player.team && e.hp > 0) ||
              this.enemies.find((e) => e.hp > 0) ||
              this.player
            );
          }
          controls() {
            return {
              forward:
                Number(this.keys.has("w") || this.keys.has("arrowup")) -
                Number(this.keys.has("s") || this.keys.has("arrowdown")) -
                this.touch.y,
              strafe: Number(this.keys.has("d")) - Number(this.keys.has("a")) + this.touch.x,
              aim: this.player.a,
              pitch: this.viewPitch / this.projection,
              sprint: this.keys.has("shift"),
              fire: this.firing || this.keys.has(" ") || this.pendingShot > 0,
              reload: this.pendingReload,
            };
          }
          flushEvents() {
            for (const e of this.arena.events) if (e.id === this.selfId) this.message(e.text);
            this.arena.events = [];
          }
          combatants(...args) {
            const result = this.arena.combatants(...args);
            this.flushEvents();
            return result;
          }
          outsideSafe(...args) {
            const result = this.arena.outsideSafe(...args);
            this.flushEvents();
            return result;
          }
          updateZone(...args) {
            const result = this.arena.updateZone(...args);
            this.flushEvents();
            return result;
          }
          damage(...args) {
            const result = this.arena.damage(...args);
            this.flushEvents();
            return result;
          }
          collectCores(...args) {
            const result = this.arena.collectCores(...args);
            this.flushEvents();
            return result;
          }
          applyHaze(...args) {
            const result = this.arena.applyHaze(...args);
            this.flushEvents();
            return result;
          }
          checkResult() {
            if (this.state === "ended") return;
            if (this.online) {
              if (this.arena.state === "ended")
                this.endMatch(this.arena.winner === this.player.team);
              return;
            }
            this.arena.checkResult();
            if (this.arena.state === "ended") this.endMatch(this.arena.winner === this.player.team);
            else if (this.player.hp <= 0 && !this.arena.teamAlive(this.player.team))
              this.endMatch(false);
          }
          endMatch(won) {
            this.state = "ended";
            this.pause();
            this.message(
              won
                ? this.mode === "training"
                  ? "CONTRACT COMPLETE"
                  : this.mode === "duo"
                    ? "PAIR OPS: TEAM SECURED"
                    : "LAST SIGNAL: YOURS"
                : "SIGNAL LOST",
              999,
            );
            this.$(".mf-copy").textContent = won
              ? `Victory. ${this.kills} eliminations. ${this.online ? "The host can return the room to the lobby for another round." : "Deploy again for a fresh match."}`
              : `Your ${this.mode === "duo" ? "team was" : "signal was"} eliminated. ${this.online ? "Watch the remaining players or wait for the next round." : "Deploy to try again."}`;
          }
          bindOnline() {
            this.on(this.$(".mf-create"), "click", () => this.connectOnline("create"));
            this.on(this.$(".mf-join"), "click", () => this.connectOnline("join"));
            this.on(this.$(".mf-codeinput"), "keydown", (e) => {
              if (e.key === "Enter") this.connectOnline("join");
            });
            this.on(this.$(".mf-leave"), "click", () => this.leaveOnline());
            this.on(this.$(".mf-copyinvite"), "click", async () => {
              if (!this.online) return;
              const url = new URL("/games/outpost-zero", location.origin);
              url.searchParams.set("room", this.online.code);
              try {
                await navigator.clipboard.writeText(url.href);
                this.$(".mf-netstatus").textContent = "Invite copied.";
              } catch {
                this.$(".mf-netstatus").textContent = "Share this room code: " + this.online.code;
              }
            });
            this.on(this.$(".mf-teamselect"), "change", (e) =>
              this.onlineAction("team", { team: Number(e.target.value) }),
            );
            const code = new URLSearchParams(location.search).get("room");
            if (code && /^[A-Z2-9]{6}$/i.test(code)) {
              this.$(".mf-codeinput").value = code.toUpperCase();
              this.$(".mf-network").open = true;
            }
          }
          async postRoom(body, signal) {
            const response = await fetch("/api/games/outpost", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(body),
              signal,
              cache: "no-store",
            });
            let data;
            try {
              data = await response.json();
            } catch {
              throw Error("Room service unavailable. Try again shortly.");
            }
            if (!response.ok) throw Error(data.error || "Could not reach the room.");
            return data;
          }
          async connectOnline(op) {
            if (this.connecting || this.online) return;
            this.connecting = true;
            this.$(".mf-netstatus").textContent = "Connecting…";
            for (const button of this.root.querySelectorAll(".mf-connectrow button"))
              button.disabled = true;
            try {
              const mode = this.mode === "training" ? "signal" : this.mode;
              const controller = new AbortController();
              this.connectionAbort = controller;

              for (let j = 1; j < 4; j++)

              if (hit.type === 3 && Math.floor(hit.u * 10) % 2 === 0) {
                c.fillStyle = "#222b30";
                c.fillRect(x, top + size * 0.64, 2, size * 0.19);
              }
              if (hit.type === 2 && hit.u > 0.16 && hit.u < 0.84) {
                c.fillStyle = "#163c43";
                c.fillRect(x, top + size * 0.3, 2, size * 0.03);
                c.fillRect(x, top + size * 0.38, 2, size * 0.03);
              }
              if (hit.type === 1 && Math.floor(hit.u * 28) % 7 === 0) {
                c.fillStyle = "#603f2d";
                c.fillRect(x, top + size * (0.12 + hit.u * 0.25), 2, size * 0.045);
              }
              if (d > 5) {
                c.fillStyle = `rgba(35,28,32,${Math.min(0.55, (d - 5) * 0.035)})`;
                c.fillRect(x, top, 2, size);
              }
            }
          }
          // Render a billboard once, then copy visible strips against the wall depth buffer.
          droneSprite(ally = false) {
            const sprite = document.createElement("canvas");
            sprite.width = 128;
            sprite.height = 160;
            const c = sprite.getContext("2d");
            c.lineWidth = 6;
            c.strokeStyle = "#101720";
            const poly = (points, fill) => {
              c.fillStyle = fill;
              c.beginPath();
              points.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
              c.closePath();
              c.fill();
              c.stroke();
            };
            c.fillStyle = "#0005";
            c.beginPath();
            c.ellipse(64, 149, 40, 8, 0, 0, TAU);
            c.fill();
            poly(
              [
                [42, 108],
                [58, 108],
                [54, 139],
                [34, 139],
              ],
              "#253b46",
            );
            poly(
              [
                [70, 108],
                [86, 108],
                [96, 139],
                [74, 139],
              ],
              "#253b46",
            );
            poly(
              [
                [25, 61],
                [40, 70],
                [31, 114],
                [14, 103],
              ],
              "#cf5d42",
            );
            poly(
              [
                [88, 68],
                [106, 59],
                [115, 103],
                [98, 115],
              ],
              "#cf5d42",
            );
            poly(
              [
                [35, 58],
                [94, 58],
                [99, 101],
                [82, 119],
                [44, 115],
                [29, 94],
              ],
              ally ? "#50bdad" : "#ef8b50",
            );
            poly(
              [
                [65, 61],
                [94, 58],
                [99, 101],
                [82, 119],
                [64, 115],
              ],
              ally ? "#28776f" : "#b7503c",
            );
            poly(
              [
                [35, 19],
                [86, 15],
                [99, 49],
                [86, 65],
                [37, 62],
                [27, 43],
              ],
              "#d2d8bf",
            );
            poly(
              [
                [78, 19],
                [86, 15],
                [99, 49],
                [86, 65],
                [77, 59],
              ],
              "#879b96",
            );
            c.fillStyle = "#192832";
            c.fillRect(34, 33, 56, 16);
            c.fillStyle = ally ? "#71ebd5" : "#ff4e42";
            c.fillRect(42, 36, 38, 7);
            c.fillStyle = "#ffe09a";
            c.fillRect(41, 69, 18, 7);
            c.fillStyle = "#242f37";
            c.fillRect(53, 86, 27, 18);
            c.strokeRect(53, 86, 27, 18);
            return sprite;
          }
          lootSprite(isCore) {
            const sprite = document.createElement("canvas");
            sprite.width = 128;
            sprite.height = 160;
            const c = sprite.getContext("2d");
            c.strokeStyle = "#101720";
            c.lineWidth = 7;
            c.lineJoin = "round";
            if (isCore) {
              c.fillStyle = "#152b2d77";
              c.beginPath();
              c.ellipse(64, 145, 35, 8, 0, 0, TAU);
              c.fill();
              c.fillStyle = "#62f0d5";
              c.beginPath();
              c.moveTo(64, 55);
              c.lineTo(103, 79);
              c.lineTo(89, 119);
              c.lineTo(39, 119);
              c.lineTo(25, 79);
              c.closePath();
              c.fill();
              c.stroke();
              c.fillStyle = "#d3fff0";
              c.beginPath();
              c.moveTo(68, 64);
              c.lineTo(44, 88);
              c.lineTo(64, 88);
              c.lineTo(52, 110);
              c.lineTo(85, 80);
              c.lineTo(64, 80);
              c.closePath();
              c.fill();
            } else {
              c.fillStyle = "#0005";
              c.beginPath();
              c.ellipse(64, 147, 54, 9, 0, 0, TAU);
              c.fill();
              c.fillStyle = "#d79345";
              c.fillRect(12, 48, 104, 96);
              c.strokeRect(12, 48, 104, 96);
              c.fillStyle = "#885532";
              c.fillRect(91, 50, 23, 92);
              c.fillStyle = "#f4be61";
              c.fillRect(15, 50, 73, 13);
              c.fillStyle = "#253b44";
              c.fillRect(13, 70, 100, 13);
              c.fillRect(13, 120, 100, 12);
              c.strokeRect(40, 86, 47, 32);
              c.fillStyle = "#62f0d5";
              c.font = "bold 25px monospace";
              c.fillText("+", 55, 111);
            }
            return sprite;
          }
          drawEnemies() {
            if (!this.sprite) this.sprite = this.droneSprite();
            if (!this.allySprite) this.allySprite = this.droneSprite(true);
            if (!this.boxSprite) this.boxSprite = this.lootSprite(false);
            if (!this.coreSprite) this.coreSprite = this.lootSprite(true);
            const p = this.camera(),
              c = this.ctx,
              ca = Math.cos(p.a),
              sa = Math.sin(p.a),
              horizon = this.h * 0.5 + this.viewPitch;
            const objects = [
              ...this.enemies
                .filter((e) => e.hp > 0)
                .map((e) => ({
                  e,
                  sprite:
                    this.mode === "duo" && e.team === this.player.team
                      ? this.allySprite
                      : this.sprite,
                  size: 0.88,
                })),
              ...this.crates
                .filter((e) => e.hp > 0)
                .map((e) => ({ e, sprite: this.boxSprite, size: 0.72 })),
              ...this.cores.map((e) => ({ e, sprite: this.coreSprite, size: 0.55 })),
            ];
            const visible = objects
              .map((o) => {
                const dx = o.e.x - p.x,
                  dy = o.e.y - p.y;
                return { ...o, z: dx * ca + dy * sa, lateral: -dx * sa + dy * ca };
              })
              .filter((v) => v.z > 0.15)
              .sort((a, b) => b.z - a.z);
            for (const { e, sprite, size, z, lateral } of visible) {
              const height = (this.projection * size) / z,
                width = height * 0.8,
                sx = this.w * 0.5 + (lateral * this.projection) / z - width / 2;
              // All billboards share the same world floor, regardless of their height.
              const sy =
                horizon +
                (this.projection * 0.5) / z -
                height +
                Math.sin(this.time * 3 + (e.phase || 0)) * height * 0.015;
              const left = Math.max(0, Math.floor(sx)),
                right = Math.min(this.w, Math.ceil(sx + width));
              for (let x = left; x < right; x++) {
                if (z >= this.depth[x]) continue;
                const u = clamp(((x - sx) / width) * 128, 0, 127);
                c.drawImage(sprite, u, 0, 1, 160, x, sy, 1, height);
              }
              const center = Math.round(sx + width / 2);
              if (
                this.mode !== "training" &&
                e.hp &&
                center >= 0 &&
                center < this.w &&
                z < this.depth[center]
              ) {
                c.fillStyle = "#101720";
                c.fillRect(sx, sy - 7, width, 4);
                c.fillStyle = e.id.startsWith("crate")
                  ? "#ffc455"
                  : this.mode === "duo" && e.team === this.player.team
                    ? "#71ebd5"
                    : "#ef795b";
                c.fillRect(sx + 1, sy - 6, ((width - 2) * e.hp) / e.maxHp, 2);
                if (
                  !e.id.startsWith("crate") &&
                  (!e.bot || (this.mode === "duo" && e.team === this.player.team))
                ) {
                  c.fillStyle =
                    this.mode === "duo" && e.team === this.player.team ? "#71ebd5" : "#fff4dc";
                  c.font = "bold 11px system-ui";
                  c.fillText(
                    (e.team === this.player.team && this.mode === "duo" ? "PARTNER / " : "") +
                      e.name,
                    sx,
                    sy - 14,
                  );
                }
                if (e.cores) {
                  c.fillStyle = "#71ebd5";
                  c.font = "bold 11px system-ui";
                  c.fillText("CORE " + e.cores, sx, sy - 12);
                }
              }
            }
          }
          drawHaze() {
            if (this.mode === "training" || this.time <= this.zone.delay) return;
            const c = this.ctx,
              p = this.camera(),
              h = this.zone.half,
              min = 8 - h,
              max = 8 + h;
            // The ray's exit from the safe rectangle forms a vertical fog curtain.
            if (!this.outsideSafe(p))
              for (let x = 0; x < this.w; x += 8) {
                const q = ((2 * x) / this.w - 1) * Math.tan(Math.PI / 6),
                  dx = Math.cos(p.a) - Math.sin(p.a) * q,
                  dy = Math.sin(p.a) + Math.cos(p.a) * q;
                const tx = (dx > 0 ? max - p.x : min - p.x) / (dx || 1e-12),
                  ty = (dy > 0 ? max - p.y : min - p.y) / (dy || 1e-12),
                  d = Math.min(tx, ty);
                if (d > 0 && d < this.depth[x]) {
                  const size = this.projection / d,
                    top = this.h * 0.5 + this.viewPitch - size / 2;
                  c.fillStyle = "#b52d5955";
                  c.fillRect(x, top, 8, size);
                }
              }
            if (this.outsideSafe(p)) {
              c.fillStyle = "#b52d5948";
              c.fillRect(0, 0, this.w, this.h);
            }
          }
          drawWeapon() {
            const c = this.ctx,
              scale = Math.min(this.w / 900, this.h / 550) * 1.2;
            const recoil = Math.max(0, 1 - (this.time - this.shotAt) / 0.12),
              reload = this.reloadUntil
                ? Math.sin(clamp((this.reloadUntil - this.time) / 1.4, 0, 1) * Math.PI)
                : 0;
            c.save();
            c.translate(
              this.w * 0.59 + Math.sin(this.step) * 4,
              this.h + Math.abs(Math.cos(this.step)) * 3 + reload * 110 + recoil * 25,
            );
            c.scale(scale, scale);
            c.lineWidth = 5;
            c.strokeStyle = "#0c131b";
            c.lineJoin = "round";
            const poly = (pts, color) => {
              c.fillStyle = color;
              c.beginPath();
              pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
              c.closePath();
              c.fill();
              c.stroke();
            };
            poly(
              [
                [-90, 10],
                [-95, -80],
                [-42, -135],
                [10, -100],
                [40, 10],
              ],
              "#a1795a",
            );
            poly(
              [
                [83, 10],
                [70, -93],
                [105, -118],
                [145, -70],
                [160, 10],
              ],
              "#b78a65",
            );
            poly(
              [
                [-55, 10],
                [-55, -107],
                [-28, -165],
                [49, -164],
                [89, -95],
                [93, 10],
              ],
              "#273b49",
            );
            poly(
              [
                [-40, -103],
                [-27, -186],
                [-8, -234],
                [36, -234],
                [61, -187],
                [65, -103],
              ],
              "#4a6873",
            );
            poly(
              [
                [13, -105],
                [13, -213],
                [36, -234],
                [61, -187],
                [65, -103],
              ],
              "#294450",
            );
            poly(
              [
                [-33, -147],
                [-25, -187],
                [49, -187],
                [58, -147],
              ],
              "#edb14f",
            );
            poly(
              [
                [-9, -213],
                [-7, -252],
                [29, -252],
                [36, -213],
              ],
              "#1b2a34",
            );
            c.fillStyle = "#a4b9b4";
            c.fillRect(-1, -248, 20, 8);
            c.fillStyle = "#e55e3c";
            c.fillRect(-20, -169, 64, 7);
            c.fillStyle = "#142831";
            c.fillRect(-25, -126, 72, 14);
            c.fillStyle = "#d4c9a9";
            c.font = "bold 14px monospace";
            c.fillText("VX–7", -20, -110);
            if (recoil > 0.3) {
              poly(
                [
                  [10, -260],
                  [-27, -287],
                  [-7, -289],
                  [-24, -321],
                  [8, -305],
                  [26, -337],
                  [30, -302],
                  [65, -319],
                  [46, -286],
                  [63, -269],
                  [28, -268],
                ],
                "#ffbf3b",
              );
              poly(
                [
                  [6, -265],
                  [0, -291],
                  [20, -311],
                  [31, -279],
                  [39, -268],
                ],
                "#fff2bc",
              );
            }
            c.restore();
          }
          drawMap() {
            const c = this.ctx,
              s = Math.max(3, Math.min(7, this.w / 140)),
              ox = this.w - 16 * s - 24,
              oy = 76;
            c.fillStyle = "#101923dd";
            c.fillRect(ox - 5, oy - 5, 16 * s + 10, 16 * s + 10);
            this.level.forEach((row, y) =>
              row.forEach((v, x) => {
                c.fillStyle = v ? "#e2b768" : "#25323a";
                c.fillRect(ox + x * s, oy + y * s, s - 1, s - 1);
              }),
            );
            if (this.mode !== "training") {
              if (this.time > this.zone.delay) {
                const low = 8 - this.zone.half,
                  high = 8 + this.zone.half;
                c.fillStyle = "#b32c5999";
                c.fillRect(ox, oy, 16 * s, low * s);
                c.fillRect(ox, oy + high * s, 16 * s, (16 - high) * s);
                c.fillRect(ox, oy + low * s, low * s, (high - low) * s);
                c.fillRect(ox + high * s, oy + low * s, (16 - high) * s, (high - low) * s);
                c.strokeStyle = "#71ebd5";
                c.lineWidth = 1;
                c.strokeRect(
                  ox + low * s,
                  oy + low * s,
                  this.zone.half * 2 * s,
                  this.zone.half * 2 * s,
                );
              }
              for (const box of this.crates)
                if (box.hp > 0) {
                  c.fillStyle = "#ffc455";
                  c.fillRect(ox + box.x * s - 2, oy + box.y * s - 2, 4, 4);
                }
              for (const core of this.cores) {
                c.fillStyle = "#71ebd5";
                c.fillRect(ox + core.x * s - 1.5, oy + core.y * s - 1.5, 3, 3);
              }
            }
            for (const e of this.enemies)
              if (e.hp > 0) {
                c.fillStyle =
                  this.mode === "duo" && e.team === this.player.team ? "#71ebd5" : "#fa6751";
                c.fillRect(ox + e.x * s - 1.5, oy + e.y * s - 1.5, 3, 3);
              }
            const p = this.player;
            c.fillStyle = "#faf2d8";
            c.beginPath();
            c.arc(ox + p.x * s, oy + p.y * s, 2.5, 0, TAU);
            c.fill();
            c.strokeStyle = "#fff";
            c.lineWidth = 1.5;
            c.beginPath();
            c.moveTo(ox + p.x * s, oy + p.y * s);
            c.lineTo(ox + (p.x + Math.cos(p.a) * 1.2) * s, oy + (p.y + Math.sin(p.a) * 1.2) * s);
            c.stroke();
          }
          render() {
            this.drawWorld();
            this.drawEnemies();
            this.drawHaze();
            if (this.player.hp > 0) this.drawWeapon();
            this.drawMap();
            if (this.time - this.hurtAt < 0.35) {
              this.ctx.fillStyle = `rgba(220,45,35,${(0.35 - (this.time - this.hurtAt)) * 0.65})`;
              this.ctx.fillRect(0, 0, this.w, this.h);
            }
          }
          loop(now) {
            const dt = Math.min(0.04, (now - this.last) / 1000);
            this.last = now;
            if (this.running || this.online) this.update(dt);
            if (this.time > this.toastUntil) this.$(".mf-toast").textContent = "";
            this.render();
            this.frame = requestAnimationFrame(this.loop);
          }
          destroy() {
            this.leaveOnline();
            cancelAnimationFrame(this.frame);
            this.abort.abort();
            this.resizeObserver.disconnect();
            if (document.pointerLockElement === this.canvas) document.exitPointerLock();
          }
        }
        customElements.define("midnry-fps", MidnryFPS);
      })();
    </script>
  </body>
