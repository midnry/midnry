          ["outpost", "ARENA / 01", "Dust Outpost", "Sandstone cover. Open sightlines. Make every move count.", "Hold Shift to sprint. Press C or Ctrl while sprinting forward to slide into cover."],

          ["skyport", "ARENA / 02", "Skyport", "Aircraft shells, hangars and room to flank.", "Keep moving in Last Signal: the safe zone shrinks as the match goes on."],
          ["rocket", "LOADOUT / 02", "Flare Launcher", "Heavy firepower. Choose your moment.", "Dealing damage charges your ability. When it is ready, press Q or tap SUPER."],
          ["freight", "ARENA / 03", "Freight Rush", "Container lanes. Tight angles. Watch the next corner.", "On mobile, move with the left stick and drag the right side of the screen to aim."],
        ];
        const images = [...screen.querySelectorAll(".mf-loadimage")];

          clearInterval(timer);
          if (!paused && !stopped) timer = setInterval(() => { if (!document.hidden) show(index + 1); }, 4500);
        };
        const show = (next) => {
          if (stopped) return;
          index = (next + slides.length) % slides.length;
          const [asset, category, title, description, tip] = slides[index];
          const updateCaption = () => {
          screen.querySelector(".mf-loadcategory").textContent = category;
          screen.querySelector(".mf-slidetitle").textContent = title;
          screen.querySelector(".mf-loaddescription").textContent = description;
          screen.querySelector(".mf-loadtip p").textContent = tip;
          screen.querySelector(".mf-loadcount").textContent = `${String(index + 1).padStart(2, "0")} / 06`;
          };
          const image = images[1 - active], token = ++request;
          image.onload = () => {
            if (stopped || token !== request) return;
            updateCaption();
            images[active].classList.remove("is-active");

        screen.querySelector(".mf-loadnext").onclick = () => { show(index + 1); schedule(); };
        pauseButton.onclick = () => { paused = !paused; syncPause(); };
        const motionChanged = () => { paused = motion.matches; syncPause(); };
        motion.addEventListener("change", motionChanged);

            if (!this.militaryLoaded && this.deathSequence && !reducedMotion) {
              const fall = this.deathProgress * this.deathProgress;
              c.translate(this.w / 2, this.h / 2);
              c.rotate(fall * 0.4);
              c.scale(1 + fall * 0.15, 1 + fall * 0.15);
              c.translate(-this.w / 2, -this.h / 2 - fall * this.h * 0.12);
            }
            if (hurt > 0)
              c.translate(
                Math.sin(now * 0.07) *
                  this.damageKick *
                  hurt *
                  (matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 1),
                Math.cos(now * 0.09) *
                  this.damageKick *
                  hurt *
                  (matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 1),
              );
            if (this.militaryLoaded) {
              this.military.render();
            } else {
              this.drawWorld();
              this.art.lighting();
              this.drawEnemies();
              this.drawHaze();
              this.drawCombatEffects();
              this.art.effectsWorld();
              if (this.player.hp > 0) {
                this.art.weaponBefore();
                this.drawWeapon();
                this.art.weaponAfter();
              }
            }
            c.restore();
            this.drawMap();
            if (this.deathSequence) {
              c.fillStyle = `rgba(12,15,16,${this.deathProgress * 0.88})`;
              c.fillRect(0, 0, this.w, this.h);
              this.$(".mf-death").style.opacity = String(Math.min(1, this.deathProgress * 3));
            }
            const movement = this.$(".mf-movement");
            const sliding = this.player.hp > 0 && this.player.slideUntil > this.time;
            movement.hidden = !this.running || this.player.hp <= 0 || (!sliding && !this.player.sprinting);
            movement.textContent = sliding ? "SLIDING" : "SPRINTING";
            const critical = this.player.hp > 0 && this.player.hp / this.player.maxHp < 0.3;
            if (hurt > 0 || critical) {
              const g = c.createRadialGradient(
                this.w / 2,
                this.h / 2,
                this.h * 0.15,
                this.w / 2,
                this.h / 2,
                Math.max(this.w, this.h) * 0.65,
              );
              g.addColorStop(0, "#cc203000");
              g.addColorStop(
                1,
                `rgba(220,30,44,${Math.min(0.8, hurt * 0.7 + (critical ? 0.22 : 0))})`,
              );
              c.fillStyle = g;
              c.fillRect(0, 0, this.w, this.h);
            }
            if (hurt > 0 && this.player.damageAngle !== null) {
              const a = this.player.damageAngle - this.player.a - Math.PI / 2;
              c.save();
              c.translate(this.w / 2, this.h / 2);
              c.rotate(a);
              c.fillStyle = "#ff5b48";
              c.strokeStyle = "#171d24";
              c.lineWidth = 3;
              c.beginPath();
              c.moveTo(70, -12);
              c.lineTo(88, 0);
              c.lineTo(70, 12);
              c.closePath();
              c.fill();
              c.stroke();
              c.restore();
            }
          }
          loop(now) {
            if (this.loading) {
              this.last = now;
              this.frame = requestAnimationFrame(this.loop);
              return;
            }
            const start = performance.now(),
              dt = Math.min(0.04, (now - this.last) / 1000);
            this.last = now;
            if (this.running || this.online) this.update(dt);
            this.updateDeath(now);
            if (this.time > this.toastUntil) this.$(".mf-toast").textContent = "";
            this.visualTime = this.online
              ? Math.min(this.time + 0.15, Math.max(this.time, (this.visualTime ?? this.time) + dt))
              : this.time;
            this.render();
            if (
              this.budget.sample(
                performance.now() - start,
                now,
                this.running || !!this.online,
                this.academy.options.adaptive,
              )
            )
              this.resize();
            if (now - (this.lastPerformanceLabel || 0) > 500) {
              this.lastPerformanceLabel = now;
              const label = this.$(".mf-perfstatus");
              if (label)
                label.textContent = `120 FPS target · ${this.budget.fps || "—"} FPS measured · ${this.budget.work.toFixed(1)} ms work · 30 FPS animation`;
            }
            this.frame = requestAnimationFrame(this.loop);
          }
          destroy() {
            clearTimeout(this.loadingTimer);
            window.outpostLoading?.stop();
            this.military?.dispose();
            this.retention?.destroy();
            this.leaveOnline();
            cancelAnimationFrame(this.frame);
            this.abort.abort();
            this.resizeObserver.disconnect();
            if (document.pointerLockElement === this.canvas) document.exitPointerLock();
          }
        }
        customElements.define("midnry-fps", MidnryFPS);
      })();
    </script>
  </body>
</html>
