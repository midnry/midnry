<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Midnry — Outpost Zero</title>
    <style>
      /* All selectors belong to this component; host-page elements are untouched. */
      midnry-fps {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 420px;
      }
      midnry-fps .mf-shell {
        position: relative;
        height: 100%;
        min-height: 420px;
        overflow: hidden;
        background: #101419;
        color: #fff4dc;
        font:
          14px system-ui,
          sans-serif;
        isolation: isolate;
      }
      midnry-fps .mf-shell * {
        box-sizing: border-box;
      }
      midnry-fps canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      midnry-fps button {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }
      midnry-fps .mf-top {
        position: absolute;
        top: 22px;
        left: 26px;
        right: 26px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        gap: 12px;
      }
      midnry-fps .mf-brand {
        font-weight: 950;
        letter-spacing: 4px;
        font-size: 20px;
      }
      midnry-fps .mf-brand small {
        display: block;
        color: #eeb74d;
        font-size: 10px;
        letter-spacing: 3px;
        margin-top: 4px;
      }
      midnry-fps .mf-topright {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      midnry-fps .mf-tag {
        border: 1px solid #ffffff55;
        padding: 7px 11px;
        font-size: 10px;
        letter-spacing: 2px;
        background: #111a;
      }
      midnry-fps .mf-pause {
        pointer-events: auto;
        border: 1px solid #ffffff55;
        background: #111a;
        width: 36px;
        height: 32px;
      }
      midnry-fps .mf-bottom {
        position: absolute;
        left: 26px;
        right: 26px;
        bottom: 25px;
        display: flex;
        justify-content: space-between;
        align-items: end;
        pointer-events: none;
      }
      midnry-fps .mf-stat {
        font-size: 11px;
        letter-spacing: 2px;
        color: #eee0c7;
      }
      midnry-fps .mf-stat strong {
        display: block;
        font-size: 36px;
        line-height: 1.15;
        letter-spacing: -1px;
        color: #fff4dc;
      }
      midnry-fps .mf-health {
        width: 140px;
        height: 5px;
        background: #402426;
        margin-top: 8px;
      }
      midnry-fps .mf-health i {
        display: block;
        height: 100%;
        width: 100%;
        background: #ffbd43;
      }
      midnry-fps .mf-ammo {
        text-align: right;
      }
      midnry-fps .mf-ammo strong span {
        font-size: 15px;
        color: #bcaf99;
        letter-spacing: 0;
      }
      midnry-fps .mf-objective {
        position: absolute;
        left: 26px;
        top: 96px;
        font-size: 10px;
        letter-spacing: 2px;
        text-shadow: 0 2px 4px #000;
        pointer-events: none;
      }
      midnry-fps .mf-objective b {
        display: block;
        font-size: 14px;
        letter-spacing: 0;
        margin-top: 6px;
        color: #ffcc58;
      }
      midnry-fps .mf-cross {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 22px;
        height: 22px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        background: linear-gradient(#fff4dc, #fff4dc) center/2px 6px no-repeat;
      }
      midnry-fps .mf-cross::before,
      midnry-fps .mf-cross::after {
        content: "";
        position: absolute;
        top: 10px;
        width: 6px;
        height: 2px;
        background: #fff4dc;
        box-shadow: 0 1px 2px #000;
      }
      midnry-fps .mf-cross::before {
        left: 0;
      }
      midnry-fps .mf-cross::after {
        right: 0;
      }
      midnry-fps .mf-toast {
        position: absolute;
        left: 50%;
        top: 62%;
        transform: translateX(-50%);
        text-align: center;
        color: #ffca49;
        font-weight: 900;
        letter-spacing: 2px;
        text-shadow: 2px 2px #000;
        pointer-events: none;
      }
      midnry-fps .mf-modal {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(90deg, #10141bd9, #10141b60);
        padding: 24px;
      }
      midnry-fps .mf-panel {
        width: min(540px, 100%);
        padding: 34px;
        border: 2px solid #070b0e;
        background: #18212bed;
        box-shadow: 9px 9px 0 #0007;
      }
      midnry-fps .mf-eyebrow {
        color: #ffc455;
        letter-spacing: 4px;
        font-size: 11px;
        font-weight: 800;
      }
      midnry-fps h1 {
        font-size: clamp(36px, 7vw, 66px);
        line-height: 0.95;
        letter-spacing: -3px;
        text-transform: uppercase;
        margin: 18px 0;
        font-weight: 950;
      }
      midnry-fps h1 em {
        color: #ffc455;
        font-style: normal;
      }
      midnry-fps .mf-copy {
        color: #c6c8c6;
        line-height: 1.65;
        max-width: 410px;
      }
      midnry-fps .mf-start {
        margin-top: 15px;
        background: #ffc455;
        color: #141a20;
        padding: 15px 26px;
        border: 3px solid #070b0e;
        box-shadow: 4px 4px 0 #070b0e;
        font-weight: 900;
        letter-spacing: 2px;
      }
      midnry-fps .mf-modes {
        display: flex;
        gap: 8px;
        margin: 18px 0 8px;
      }
      midnry-fps .mf-mode {
        min-height: 44px;
        flex: 1;
        padding: 10px;
        border: 2px solid #070b0e;
        background: #263b44;
        font-weight: 800;
        font-size: 12px;
      }
      midnry-fps .mf-mode[aria-pressed="true"] {
        background: #ffc455;
        color: #141a20;
      }
      midnry-fps .mf-match {
        position: absolute;
        top: 141px;
        left: 26px;
        max-width: 230px;
        font-size: 11px;
        line-height: 1.9;
        font-weight: 700;
        letter-spacing: 1px;
        pointer-events: none;
        text-shadow: 1px 2px 3px #000;
      }
      midnry-fps .mf-match b {
        color: #71ebd5;
      }
      midnry-fps .mf-zone {
        color: #ffb6a7;
      }
      midnry-fps .mf-help {
        font-size: 11px;
        line-height: 1.8;
        margin-top: 24px;
        color: #9fa9b1;
      }
      midnry-fps .mf-touch {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: none;
      }
      midnry-fps .mf-stick {
        position: absolute;
        left: 24px;
        bottom: 102px;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        border: 2px solid #ffffff45;
        background: #151b2466;
        pointer-events: auto;
        touch-action: none;
      }
      midnry-fps .mf-stick i {
        position: absolute;
        left: 35px;
        top: 35px;
        width: 38px;
        height: 38px;
        border: 2px solid #fff6;
        border-radius: 50%;
        background: #ffc45580;
      }
      midnry-fps .mf-fire,
      midnry-fps .mf-reload {
        position: absolute;
        right: 25px;
        bottom: 118px;
        width: 76px;
        height: 76px;
        border: 3px solid #151b24;
        border-radius: 50%;
        background: #ffc455c9;
        color: #151b24;
        font-size: 12px;
        font-weight: 900;
        pointer-events: auto;
        touch-action: none;
      }
      midnry-fps .mf-reload {
        right: 112px;
        bottom: 115px;
        width: 48px;
        height: 48px;
        background: #e8e0ccab;
      }
      midnry-fps [hidden] {
        display: none !important;
      }
      @media (pointer: coarse) {
        midnry-fps .mf-touch {
          display: block;
        }
      }
      @media (max-width: 600px) {
        midnry-fps .mf-top {
          top: 16px;
          left: 16px;
          right: 16px;
        }
        midnry-fps .mf-bottom {
          left: 16px;
          right: 16px;
          bottom: 18px;
        }
        midnry-fps .mf-objective {
          top: 82px;
          left: 16px;
        }
        midnry-fps .mf-panel {
          padding: 24px;
        }
        midnry-fps .mf-match {
          left: 16px;
          top: 127px;
          max-width: 210px;
          font-size: 10px;
        }
        midnry-fps .mf-tag {
          display: none;
        }
      }
    </style>
  </head>
  <!-- For inline integration copy the style, element and script. Set a height on the host. -->
  <body style="margin: 0; background: #101419">
    <midnry-fps style="height: 100dvh" aria-label="Outpost Zero first-person shooter"></midnry-fps>
    <script>
      (() => {
        "use strict";
        // A custom element keeps state private and supports multiple independent instances.
        if (customElements.get("midnry-fps")) return;
        const TAU = Math.PI * 2;
        const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
        const angleDiff = (a) => Math.atan2(Math.sin(a), Math.cos(a));

        class MidnryFPS extends HTMLElement {
          connectedCallback() {
            if (this.engine) return;
            this.innerHTML = `<div class="mf-shell" tabindex="0">
        <canvas aria-label="Game viewport"></canvas>
        <div class="mf-top"><div class="mf-brand">MIDNRY<small>OUTPOST ZERO / FIELD OPS</small></div><div class="mf-topright"><span class="mf-tag">RAYCAST / COMIC EDITION</span><button class="mf-pause" aria-label="Pause game">II</button></div></div>
        <div class="mf-objective">TRAINING CONTRACT<b class="mf-mission">Eliminate the sentry drones</b></div>
        <div class="mf-match" hidden><b class="mf-cores">CHARGE CORES 0</b><div class="mf-zone"></div></div><div class="mf-cross"></div><div class="mf-toast" role="status" aria-live="polite"></div>
        <div class="mf-bottom"><div class="mf-stat">VITALS<strong class="mf-hp">100</strong><div class="mf-health"><i></i></div></div><div class="mf-stat mf-ammo">VX–7 / AUTO CARBINE<strong class="mf-rounds">24 <span>/ ∞</span></strong></div></div>
        <div class="mf-touch"><div class="mf-stick" aria-label="Movement joystick"><i></i></div><button class="mf-reload" aria-label="Reload">R</button><button class="mf-fire" aria-label="Fire weapon">FIRE</button></div>
        <div class="mf-modal"><div class="mf-panel"><div class="mf-eyebrow">MIDNRY ORIGINAL / 01</div><h1>Outpost<br><em>Zero.</em></h1><p class="mf-copy">A sun-scorched outpost. Six rogue sentries. One very loud solution. Drop into a comic-book combat sandbox.</p><div class="mf-modes" role="group" aria-label="Game mode"><button class="mf-mode" data-mode="training" aria-pressed="true">FIELD OPS</button><button class="mf-mode" data-mode="signal" aria-pressed="false">LAST SIGNAL · SOLO</button></div><button class="mf-start">DEPLOY →</button><div class="mf-help">WASD · move &nbsp; / &nbsp; Mouse · aim &nbsp; / &nbsp; Click or Space · fire<br>R · reload &nbsp; / &nbsp; Shift · sprint &nbsp; / &nbsp; Esc or P · pause<br>Touch: left stick to move, drag the right side to aim.</div></div></div>
      </div>`;
            this.engine = new Game(this);
          }
          disconnectedCallback() {
            this.engine?.destroy();
            this.engine = null;
          }
        }

        // Editable arena: 0 = floor, 1 = sandstone, 2 = teal steel, 3 = hazard wall.
        const LEVEL = [
          "1111111111111111",
          "1000000000000001",
          "1000000000000001",
          "1000220000110001",
          "1000220000110001",
          "1000000000000001",
          "1000000000000001",
          "1000000330000001",
          "1000000330000001",
          "1000000000000001",
          "1001100000220001",
          "1001100000220001",
          "1000000000000001",
          "1000000000000001",
          "1000000000000001",
          "1111111111111111",
        ].map((row) => [...row].map(Number));

        class Game {
          constructor(root) {
            this.root = root;
            this.shell = root.querySelector(".mf-shell");
            this.canvas = root.querySelector("canvas");
            this.ctx = this.canvas.getContext("2d", { alpha: false });
            this.$ = (s) => root.querySelector(s);
            this.abort = new AbortController();
            this.keys = new Set();
            this.touch = { x: 0, y: 0 };
            this.firing = false;
            this.running = false;
            this.time = 0;
            this.last = performance.now();
            this.frame = 0;
            this.viewPitch = 0;
            this.mode = "training";
            this.reset();
            this.bindInputs();
            this.resizeObserver = new ResizeObserver(() => this.resize());
            this.resizeObserver.observe(this.shell);
            this.resize();
            this.loop = this.loop.bind(this);
            this.frame = requestAnimationFrame(this.loop);
          }
          // Last Signal uses the same arena, with a clear center for the final zone.
          reset() {
            this.time = 0;
            this.state = "fresh";
            this.running = false;
            this.viewPitch = 0;
            this.level = LEVEL.map((row) => [...row]);
            if (this.mode === "signal")
              for (let y = 7; y <= 8; y++) for (let x = 7; x <= 8; x++) this.level[y][x] = 0;
            this.player = {
              id: "player",
              x: 3.5,
              y: 13.5,
              a: -0.18,
              hp: 100,
              maxHp: 100,
              damage: 40,
              cores: 0,
              exposure: 0,
            };
            this.ammo = 24;
            this.kills = 0;
            this.shotAt = -10;
            this.reloadUntil = 0;
            this.hurtAt = -10;
            this.step = 0;
            this.keys.clear();
            this.firing = false;
            this.touch = { x: 0, y: 0 };
            this.look = null;
            this.zone = { half: 7, delay: 12, duration: 150, minHalf: 0.6 };
            this.crates = [];
            this.cores = [];
            const spawnPoints = [
              [2.5, 2.5],
              [8.5, 2.5],
              [13.5, 2.5],
              [13.5, 8.5],
              [13.5, 13.5],
              [8.5, 13.5],
              [2.5, 13.5],
              [2.5, 8.5],
            ];
            // Shuffle spawn slots rather than allowing overlapping random spawns.
            for (let i = spawnPoints.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [spawnPoints[i], spawnPoints[j]] = [spawnPoints[j], spawnPoints[i]];
            }
            const spots =
              this.mode === "signal"
                ? spawnPoints.slice(1)
                : [
                    [11.5, 12.5],
                    [7.5, 11.5],
                    [12.5, 7.5],
                    [5.5, 5.5],
                    [9.5, 2.5],
                    [2.5, 2.5],
                  ];
            this.enemies = spots.map(([x, y], i) => ({
              id: "bot" + i,
              x,
              y,
              hp: this.mode === "signal" ? 100 : 120,
              maxHp: this.mode === "signal" ? 100 : 120,
              damage: 16,
              cores: 0,
              hit: -10,
              attack: 1 + i * 0.2,
              phase: i * 1.3,
              exposure: 0,
              nextPath: 0,
              path: [],
            }));
            if (this.mode === "signal") {
              [this.player.x, this.player.y] = spawnPoints[0];
              this.player.a = Math.atan2(8 - this.player.y, 8 - this.player.x);
              this.crates = [
                [4.5, 2.5],
                [11.5, 2.5],
                [5.5, 5.5],
                [10.5, 5.5],
                [2.5, 6.5],
                [13.5, 6.5],
                [4.5, 9.5],
                [11.5, 9.5],
                [5.5, 12.5],
                [10.5, 12.5],
                [7.5, 6.5],
                [8.5, 9.5],
              ].map(([x, y], i) => ({ id: "crate" + i, x, y, hp: 80, maxHp: 80, hit: -10 }));
            }
            this.toastUntil = 0;
            this.$(".mf-toast").textContent = "";
            this.$(".mf-start").textContent = "DEPLOY →";
            this.$(".mf-copy").textContent =
              this.mode === "signal"
                ? "Eight combatants. One survivor. Break Supply Crates for Charge Cores: +25 max health and +8 weapon damage per core. Red Haze closes in after 12 seconds. Stay inside the safe zone."
                : "A sun-scorched outpost. Six rogue sentries. One very loud solution. Drop into a comic-book combat sandbox.";
            this.updateHUD();
          }
          combatants() {
            return [this.player, ...this.enemies];
          }
          outsideSafe(e) {
            return Math.abs(e.x - 8) > this.zone.half || Math.abs(e.y - 8) > this.zone.half;
          }
          updateZone() {
            this.zone.half =
              7 -
              (7 - this.zone.minHalf) *
                clamp((this.time - this.zone.delay) / this.zone.duration, 0, 1);
          }
          // All damage goes through one path: crates, bots, player and Red Haze.
          damage(target, amount, source = null) {
            if (target.hp <= 0) return;
            target.hp = Math.max(0, target.hp - amount);
            target.hit = this.time;
            if (target === this.player) this.hurtAt = this.time;
            if (target.hp > 0) return;
            if (target.id.startsWith("crate")) {
              this.cores.push({ x: target.x, y: target.y });
              if (source === this.player) this.message("SUPPLY CRATE OPEN / COLLECT THE CORE");
            } else if (target !== this.player) {
              if (source === this.player) {
                this.kills++;
                this.message(this.mode === "signal" ? "RIVAL ELIMINATED" : "SENTRY DOWN");
              }
              if (this.mode === "signal")
                for (let i = 0; i < target.cores; i++)
                  this.cores.push({
                    x: target.x + ((i % 3) - 1) * 0.12,
                    y: target.y + Math.floor(i / 3) * 0.08,
                  });
            }
          }
          collectCores(entity) {
            if (entity.hp <= 0) return;
            for (let i = this.cores.length - 1; i >= 0; i--) {
              const core = this.cores[i];
              if (
                Math.hypot(core.x - entity.x, core.y - entity.y) < 0.65 &&
                this.visible(entity, core)
              ) {
                this.cores.splice(i, 1);
                entity.cores++;
                entity.maxHp += 25;
                entity.hp = Math.min(entity.maxHp, entity.hp + 25);
                entity.damage += 8;
                if (entity === this.player) this.message("+1 CHARGE CORE / HEALTH +25 · DAMAGE +8");
              }
            }
          }
          applyHaze(entity, dt) {
            if (entity.hp <= 0) return;
            if (this.time > this.zone.delay && this.outsideSafe(entity)) {
              entity.exposure += dt;
              const rate = 5 + (this.time - this.zone.delay) * 0.08 + entity.exposure * 0.6;
              this.damage(entity, rate * dt);
            } else entity.exposure = 0;
          }
          checkResult() {
            if (this.state === "ended") return;
            if (this.player.hp <= 0) this.endMatch(false);
            else if (this.enemies.every((e) => e.hp <= 0)) this.endMatch(true);
          }
          endMatch(won) {
            this.state = "ended";
            this.pause();
            const title =
              this.mode === "signal"
                ? won
                  ? "LAST SIGNAL: YOURS"
                  : "SIGNAL LOST"
                : won
                  ? "CONTRACT COMPLETE"
                  : "SIGNAL LOST";
            this.message(title, 999);
            const alive = this.combatants().filter((e) => e.hp > 0).length;
            this.$(".mf-copy").textContent =
              this.mode === "signal"
                ? won
                  ? `You are the last survivor. ${this.player.cores} Charge Cores collected, ${this.kills} rivals eliminated. Deploy again for a fresh match.`
                  : `Eliminated with ${alive} survivor${alive === 1 ? "" : "s"} remaining. Break crates early and follow the safe zone on your map. Deploy to try again.`
                : won
                  ? "All six sentries neutralized. Outpost secured. Deploy again to replay."
                  : "The sentries got the upper hand. Keep moving, use cover, and reload before your next push.";
          }
          on(target, event, handler, options = {}) {
            target.addEventListener(event, handler, { ...options, signal: this.abort.signal });
          }
          bindInputs() {
            this.on(this.$(".mf-start"), "click", () => this.start());
            for (const button of this.root.querySelectorAll(".mf-mode"))
              this.on(button, "click", () => {
                this.mode = button.dataset.mode;
                this.reset();
                for (const other of this.root.querySelectorAll(".mf-mode"))
                  other.setAttribute("aria-pressed", String(other === button));
              });
            this.on(this.$(".mf-pause"), "click", () => this.pause());
            this.on(this.shell, "keydown", (e) => {
              const k = e.key.toLowerCase();
              if (
                [
                  " ",
                  "arrowup",
                  "arrowdown",
                  "arrowleft",
                  "arrowright",
                  "w",
                  "a",
                  "s",
                  "d",
                  "r",
                  "p",
                  "shift",
                ].includes(k)
              )
                e.preventDefault();
              if (k === "escape" || k === "p") {
                if (this.running) this.pause();
                return;
              }
              if (!this.running) return;
              this.keys.add(k);
              if (k === "r") this.reload();
              if (k === " " && !e.repeat) this.shoot();
            });
            this.on(this.shell, "keyup", (e) => this.keys.delete(e.key.toLowerCase()));
            this.on(window, "blur", () => {
              if (this.running) this.pause();
            });
            this.on(document, "visibilitychange", () => {
              if (document.hidden && this.running) this.pause();
            });
            this.on(document, "pointerlockchange", () => {
              if (document.pointerLockElement === this.canvas) this.hadLock = true;
              else if (this.hadLock && this.running) {
                this.hadLock = false;
                this.pause();
              }
            });
            this.on(document, "mousemove", (e) => {
              if (this.running && document.pointerLockElement === this.canvas) {
                this.player.a += e.movementX * 0.0025;
                this.viewPitch = clamp(
                  this.viewPitch - e.movementY * 0.35,
                  -this.h * 0.18,
                  this.h * 0.18,
                );
              }
            });
            this.on(this.canvas, "pointerdown", (e) => {
              if (!this.running) return;
              this.shell.focus({ preventScroll: true });
              if (e.pointerType === "mouse" && e.button === 0) {
                this.firing = true;
                this.shoot();
                this.lockMouse();
              } else if (
                e.clientX >
                this.canvas.getBoundingClientRect().left + this.canvas.clientWidth * 0.35
              ) {
                this.look = { id: e.pointerId, x: e.clientX, y: e.clientY };
                this.canvas.setPointerCapture(e.pointerId);
              }
            });
            this.on(this.canvas, "pointermove", (e) => {

              c.fillStyle = "#152b2d77";

              c.ellipse(64, 145, 35, 8, 0, 0, TAU);
              c.fill();
              c.fillStyle = "#62f0d5";
              c.beginPath();
              c.moveTo(64, 55);
              c.lineTo(103, 79);
              c.lineTo(89, 119);
              c.lineTo(39, 119);
              c.lineTo(25, 79);
              c.closePath();
              c.fill();
              c.stroke();
              c.fillStyle = "#d3fff0";
              c.beginPath();
              c.moveTo(68, 64);
              c.lineTo(44, 88);
              c.lineTo(64, 88);
              c.lineTo(52, 110);
              c.lineTo(85, 80);
              c.lineTo(64, 80);
              c.closePath();
              c.fill();
            } else {
              c.fillStyle = "#0005";
              c.beginPath();
              c.ellipse(64, 147, 54, 9, 0, 0, TAU);
              c.fill();
              c.fillStyle = "#d79345";
              c.fillRect(12, 48, 104, 96);
              c.strokeRect(12, 48, 104, 96);
              c.fillStyle = "#885532";
              c.fillRect(91, 50, 23, 92);
              c.fillStyle = "#f4be61";
              c.fillRect(15, 50, 73, 13);
              c.fillStyle = "#253b44";
              c.fillRect(13, 70, 100, 13);
              c.fillRect(13, 120, 100, 12);
              c.strokeRect(40, 86, 47, 32);
              c.fillStyle = "#62f0d5";
              c.font = "bold 25px monospace";
              c.fillText("+", 55, 111);
            }
            return sprite;
          }
          drawEnemies() {
            if (!this.sprite) this.sprite = this.droneSprite();
            if (!this.boxSprite) this.boxSprite = this.lootSprite(false);
            if (!this.coreSprite) this.coreSprite = this.lootSprite(true);
            const p = this.player,
              c = this.ctx,
              ca = Math.cos(p.a),
              sa = Math.sin(p.a),
              horizon = this.h * 0.5 + this.viewPitch;
            const objects = [
              ...this.enemies
                .filter((e) => e.hp > 0)
                .map((e) => ({ e, sprite: this.sprite, size: 0.88 })),
              ...this.crates
                .filter((e) => e.hp > 0)
                .map((e) => ({ e, sprite: this.boxSprite, size: 0.72 })),
              ...this.cores.map((e) => ({ e, sprite: this.coreSprite, size: 0.55 })),
            ];
            const visible = objects
              .map((o) => {
                const dx = o.e.x - p.x,
                  dy = o.e.y - p.y;
                return { ...o, z: dx * ca + dy * sa, lateral: -dx * sa + dy * ca };
              })
              .filter((v) => v.z > 0.15)
              .sort((a, b) => b.z - a.z);
            for (const { e, sprite, size, z, lateral } of visible) {
              const height = (this.projection * size) / z,
                width = height * 0.8,
                sx = this.w * 0.5 + (lateral * this.projection) / z - width / 2;
              // All billboards share the same world floor, regardless of their height.
              const sy =
                horizon +
                (this.projection * 0.5) / z -
                height +
                Math.sin(this.time * 3 + (e.phase || 0)) * height * 0.015;
              const left = Math.max(0, Math.floor(sx)),
                right = Math.min(this.w, Math.ceil(sx + width));
              for (let x = left; x < right; x++) {
                if (z >= this.depth[x]) continue;
                const u = clamp(((x - sx) / width) * 128, 0, 127);
                c.drawImage(sprite, u, 0, 1, 160, x, sy, 1, height);
              }
              const center = Math.round(sx + width / 2);
              if (
                this.mode === "signal" &&
                e.hp &&
                center >= 0 &&
                center < this.w &&
                z < this.depth[center]
              ) {
                c.fillStyle = "#101720";
                c.fillRect(sx, sy - 7, width, 4);
                c.fillStyle = e.id.startsWith("crate") ? "#ffc455" : "#ef795b";
                c.fillRect(sx + 1, sy - 6, ((width - 2) * e.hp) / e.maxHp, 2);
                if (e.cores) {
                  c.fillStyle = "#71ebd5";
                  c.font = "bold 11px system-ui";
                  c.fillText("CORE " + e.cores, sx, sy - 12);
                }
              }
            }
          }
          drawHaze() {
            if (this.mode !== "signal" || this.time <= this.zone.delay) return;
            const c = this.ctx,
              p = this.player,
              h = this.zone.half,
              min = 8 - h,
              max = 8 + h;
            // The ray's exit from the safe rectangle forms a vertical fog curtain.
            if (!this.outsideSafe(p))
              for (let x = 0; x < this.w; x += 8) {
                const q = ((2 * x) / this.w - 1) * Math.tan(Math.PI / 6),
                  dx = Math.cos(p.a) - Math.sin(p.a) * q,
                  dy = Math.sin(p.a) + Math.cos(p.a) * q;
                const tx = (dx > 0 ? max - p.x : min - p.x) / (dx || 1e-12),
                  ty = (dy > 0 ? max - p.y : min - p.y) / (dy || 1e-12),
                  d = Math.min(tx, ty);
                if (d > 0 && d < this.depth[x]) {
                  const size = this.projection / d,
                    top = this.h * 0.5 + this.viewPitch - size / 2;
                  c.fillStyle = "#b52d5955";
                  c.fillRect(x, top, 8, size);
                }
              }
            if (this.outsideSafe(p)) {
              c.fillStyle = "#b52d5948";
              c.fillRect(0, 0, this.w, this.h);
            }
          }
          drawWeapon() {
            const c = this.ctx,
              scale = Math.min(this.w / 900, this.h / 550) * 1.2;
            const recoil = Math.max(0, 1 - (this.time - this.shotAt) / 0.12),
              reload = this.reloadUntil
                ? Math.sin(clamp((this.reloadUntil - this.time) / 1.4, 0, 1) * Math.PI)
                : 0;
            c.save();
            c.translate(
              this.w * 0.59 + Math.sin(this.step) * 4,
              this.h + Math.abs(Math.cos(this.step)) * 3 + reload * 110 + recoil * 25,
            );
            c.scale(scale, scale);
            c.lineWidth = 5;
            c.strokeStyle = "#0c131b";
            c.lineJoin = "round";
            const poly = (pts, color) => {
              c.fillStyle = color;
              c.beginPath();
              pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
              c.closePath();
              c.fill();
              c.stroke();
            };
            poly(
              [
                [-90, 10],
                [-95, -80],
                [-42, -135],
                [10, -100],
                [40, 10],
              ],
              "#a1795a",
            );
            poly(
              [
                [83, 10],
                [70, -93],
                [105, -118],
                [145, -70],
                [160, 10],
              ],
              "#b78a65",
            );
            poly(
              [
                [-55, 10],
                [-55, -107],
                [-28, -165],
                [49, -164],
                [89, -95],
                [93, 10],
              ],
              "#273b49",
            );
            poly(
              [
                [-40, -103],
                [-27, -186],
                [-8, -234],
                [36, -234],
                [61, -187],
                [65, -103],
              ],
              "#4a6873",
            );
            poly(
              [
                [13, -105],
                [13, -213],
                [36, -234],
                [61, -187],
                [65, -103],
              ],
              "#294450",
            );
            poly(
              [
                [-33, -147],
                [-25, -187],
                [49, -187],
                [58, -147],
              ],
              "#edb14f",
            );
            poly(
              [
                [-9, -213],
                [-7, -252],
                [29, -252],
                [36, -213],
              ],
              "#1b2a34",
            );
            c.fillStyle = "#a4b9b4";
            c.fillRect(-1, -248, 20, 8);
            c.fillStyle = "#e55e3c";
            c.fillRect(-20, -169, 64, 7);
            c.fillStyle = "#142831";
            c.fillRect(-25, -126, 72, 14);
            c.fillStyle = "#d4c9a9";
            c.font = "bold 14px monospace";
            c.fillText("VX–7", -20, -110);
            if (recoil > 0.3) {
              poly(
                [
                  [10, -260],
                  [-27, -287],
                  [-7, -289],
                  [-24, -321],
                  [8, -305],
                  [26, -337],
                  [30, -302],
                  [65, -319],
                  [46, -286],
                  [63, -269],
                  [28, -268],
                ],
                "#ffbf3b",
              );
              poly(
                [
                  [6, -265],
                  [0, -291],
                  [20, -311],
                  [31, -279],
                  [39, -268],
                ],
                "#fff2bc",
              );
            }
            c.restore();
          }
          drawMap() {
            const c = this.ctx,
              s = Math.max(3, Math.min(7, this.w / 140)),
              ox = this.w - 16 * s - 24,
              oy = 76;
            c.fillStyle = "#101923dd";
            c.fillRect(ox - 5, oy - 5, 16 * s + 10, 16 * s + 10);
            this.level.forEach((row, y) =>
              row.forEach((v, x) => {
                c.fillStyle = v ? "#e2b768" : "#25323a";
                c.fillRect(ox + x * s, oy + y * s, s - 1, s - 1);
              }),
            );
            if (this.mode === "signal") {
              if (this.time > this.zone.delay) {
                const low = 8 - this.zone.half,
                  high = 8 + this.zone.half;
                c.fillStyle = "#b32c5999";
                c.fillRect(ox, oy, 16 * s, low * s);
                c.fillRect(ox, oy + high * s, 16 * s, (16 - high) * s);
                c.fillRect(ox, oy + low * s, low * s, (high - low) * s);
                c.fillRect(ox + high * s, oy + low * s, (16 - high) * s, (high - low) * s);
                c.strokeStyle = "#71ebd5";
                c.lineWidth = 1;
                c.strokeRect(
                  ox + low * s,
                  oy + low * s,
                  this.zone.half * 2 * s,
                  this.zone.half * 2 * s,
                );
              }
              for (const box of this.crates)
                if (box.hp > 0) {
                  c.fillStyle = "#ffc455";
                  c.fillRect(ox + box.x * s - 2, oy + box.y * s - 2, 4, 4);
                }
              for (const core of this.cores) {
                c.fillStyle = "#71ebd5";
                c.fillRect(ox + core.x * s - 1.5, oy + core.y * s - 1.5, 3, 3);
              }
            }
            for (const e of this.enemies)
              if (e.hp > 0) {
                c.fillStyle = "#fa6751";
                c.fillRect(ox + e.x * s - 1.5, oy + e.y * s - 1.5, 3, 3);
              }
            const p = this.player;
            c.fillStyle = "#faf2d8";
            c.beginPath();
            c.arc(ox + p.x * s, oy + p.y * s, 2.5, 0, TAU);
            c.fill();
            c.strokeStyle = "#fff";
            c.lineWidth = 1.5;
            c.beginPath();
            c.moveTo(ox + p.x * s, oy + p.y * s);
            c.lineTo(ox + (p.x + Math.cos(p.a) * 1.2) * s, oy + (p.y + Math.sin(p.a) * 1.2) * s);
            c.stroke();
          }
          render() {
            this.drawWorld();
            this.drawEnemies();
            this.drawHaze();
            this.drawWeapon();
            this.drawMap();
            if (this.time - this.hurtAt < 0.35) {
              this.ctx.fillStyle = `rgba(220,45,35,${(0.35 - (this.time - this.hurtAt)) * 0.65})`;
              this.ctx.fillRect(0, 0, this.w, this.h);
            }
          }
          loop(now) {
            const dt = Math.min(0.04, (now - this.last) / 1000);
            this.last = now;
            if (this.running) this.update(dt);
            this.render();
            this.frame = requestAnimationFrame(this.loop);
          }
          destroy() {
            cancelAnimationFrame(this.frame);
            this.abort.abort();
            this.resizeObserver.disconnect();
            if (document.pointerLockElement === this.canvas) document.exitPointerLock();
          }
        }
        customElements.define("midnry-fps", MidnryFPS);
      })();
    </script>
  </body>
</html>
